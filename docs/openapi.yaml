            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Sessions]
      summary: Đăng xuất mọi thiết bị khác (giữ phiên hiện tại)
      operationId: revokeOtherSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '`data.revokedCount` = số phiên đã thu hồi'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Thu hồi một phiên khác của chính mình
      description: Phiên của người khác trả 404 như không tồn tại (chống IDOR).
      operationId: revokeSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          description: '`CANNOT_REVOKE_CURRENT_SESSION` hoặc `VALIDATION_ERROR` (id sai định dạng)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{24}$'
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        const: XMLHttpRequest
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    JobSchedule:
      oneOf:
        - type: object
          required: [kind, runAt]
          properties:
            kind:
              type: string
              const: ONCE
            runAt:
              type: string
              format: date-time
        - type: object
          required: [kind, everyDays, time]
          properties:
            kind:
              type: string
              const: INTERVAL
            everyDays:
              type: integer
              minimum: 1
              maximum: 365
            time:
              type: string
              description: HH:mm theo JOBS_TIMEZONE
            startDate:
              type: string
              description: YYYY-MM-DD (mốc neo, tuỳ chọn)
    FileItem:
      type: object
      properties:
        id:
          type: string
        originalName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        createdAt:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    MediaFolderItem:
      type: object
      properties:
        name:
          type: string
        isSystem:
          type: boolean
          description: Thư mục hệ thống — không tạo / xoá / tải tay
        mediaCount:
          type: integer
        totalSize:
          type: integer
          description: byte
        coverIds:
          type: array
          items:
            type: string
        lastUploadedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: [string, 'null']
          format: date-time
    AdminUserItem:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [MEMBER, ADMIN, SUPER_ADMIN]
        avatarMediaId:
          type: [string, 'null']
          description: Ảnh đại diện (hiển thị qua `GET /media/{id}/content`)
        status:
          type: string
          enum: [ACTIVE, LOCKED, UNVERIFIED]
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        lockedAt:
          type: [string, 'null']
          format: date-time
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    SettingItem:
      type: object
      properties:
        key:
          type: string
        value: {}
        default: {}
        isPublic:
          type: boolean
        input:
          type: string
          enum: [boolean, select]
        options:
          type: [array, 'null']
          description: Chỉ với `input = select`; lựa chọn `disabled` = server chưa cấu hình biến môi trường
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
              disabled:
                type: boolean
        label:
          type: string
        description:
          type: string
        updatedAt:
          type: [string, 'null']
          format: date-time
        updatedBy:
          type: [object, 'null']
          properties:
            id:
              type: string
            name:
              type: string
    SessionInfo:
      type: object
      properties:
        id:
          type: string
        device:
          type: object
          properties:
            browser:
              type: string
            os:
              type: string
            deviceType:
              type: string
              enum: [desktop, mobile, tablet]
        ip:
          type: string
        userAgent:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [MEMBER, ADMIN, SUPER_ADMIN]
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        lockedAt:
          type: [string, 'null']
          format: date-time
        avatarMediaId:
          type: [string, 'null']
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT HS256, hạn 15 phút, payload chỉ `sub` + `sid`
        user:
          $ref: '#/components/schemas/User'
    SuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          examples: [email]
        message:
          type: string
          examples: [địa chỉ email không hợp lệ]
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [VALIDATION_ERROR]
            message:
              type: string
              examples: [Dữ liệu không hợp lệ]
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
    HealthStatus:
      type: object
      required: [status, database, uptime, timestamp]
      properties:
        status:
          type: string
          const: ok
        database:
          type: string
          const: up
        uptime:
          type: integer
          description: Số giây tiến trình đã chạy
        timestamp:
          type: string
          format: date-time
    TokenBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Token lấy từ query `?token=` của link trong email
  responses:
    AdminUserResult:
      description: User sau khi cập nhật
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    Conflict:
      description: '`USER_STATE_CHANGED`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: '`RESOURCE_NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        Access token thiếu / sai (`AUTH_TOKEN_INVALID`) hoặc hết hạn (`AUTH_TOKEN_EXPIRED`), hoặc
        phiên đã bị thu hồi. Frontend gọi refresh rồi thử lại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: '`FORBIDDEN` (không đủ quyền) hoặc `ACCOUNT_LOCKED`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Message:
      description: Thành công, chỉ có thông điệp
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                properties:
                  data:
                    type: 'null'
    ValidationError:
      description: Dữ liệu vào sai (`VALIDATION_ERROR`, `details` theo từng trường)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Vượt giới hạn request (`RATE_LIMITED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Database không phản hồi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: SERVICE_UNAVAILABLE
              message: Cơ sở dữ liệu không phản hồi
