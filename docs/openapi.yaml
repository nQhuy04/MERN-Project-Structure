        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/presign:
    post:
      tags: [Files]
      summary: 'Bước 1: tạo bản ghi PENDING + presigned PUT lên R2'
      description: |
        Whitelist: image/jpeg, image/png, image/webp, image/gif, application/pdf; tối đa 10MB.
        Quota theo user: tối đa 100 file và 200MB tổng dung lượng (tính cả bản ghi PENDING).
        Giới hạn tần suất 30 lần / 15 phút / user.
      operationId: presignFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, size]
              properties:
                fileName:
                  type: string
                  maxLength: 255
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, image/gif, application/pdf]
                size:
                  type: integer
                  minimum: 1
                  maximum: 10485760
      responses:
        '201':
          description: 'Client PUT file tới `upload.url` với đúng `upload.headers` (không kèm cookie/token)'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          file:
                            $ref: '#/components/schemas/FileItem'
                          upload:
                            type: object
                            properties:
                              url:
                                type: string
                              method:
                                type: string
                                const: PUT
                              headers:
                                type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`STORAGE_QUOTA_EXCEEDED` — vượt quota số file hoặc tổng dung lượng'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /files/{id}/complete:
    post:
      tags: [Files]
      summary: 'Bước 3: xác nhận đã upload — server HEAD object thật trên R2 để đối chiếu'
      operationId: completeFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: File READY
        '400':
          description: '`UPLOAD_NOT_FOUND` hoặc `UPLOAD_MISMATCH`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/{id}/download:
