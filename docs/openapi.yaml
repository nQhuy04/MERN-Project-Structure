openapi: 3.1.0
info:
  title: MERN Base API
  version: 0.1.0
  description: |
    API của source base MERN. Mọi route nằm dưới `/api/v1`.

    **Response thành công**: `{ "success": true, "message"?: "...", "data": ... }`

    **Response lỗi** (chỉ do `errorHandler` tạo):
    `{ "success": false, "error": { "code", "message", "details"?: [{ "field", "message" }] } }`

    Frontend rẽ nhánh theo `error.code` (không theo HTTP status hay message).

    | code | HTTP | Ý nghĩa |
    |---|---|---|
    | VALIDATION_ERROR | 400 | Dữ liệu vào sai (Zod, Mongoose, ObjectId sai định dạng) |
    | INVALID_JSON | 400 | Body không phải JSON hợp lệ |
    | ROUTE_NOT_FOUND | 404 | Đường dẫn không tồn tại |
    | RESOURCE_NOT_FOUND | 404 | Không tìm thấy dữ liệu |
    | DUPLICATE_VALUE | 409 | Trùng giá trị unique |
    | PAYLOAD_TOO_LARGE | 413 | Body vượt giới hạn |
    | INTERNAL_ERROR | 500 | Lỗi không xác định (chi tiết chỉ có trong log server) |
    | SERVICE_UNAVAILABLE | 503 | Phụ thuộc (database) không phản hồi |
    | RATE_LIMITED | 429 | Vượt giới hạn số request (route auth theo IP; đổi mật khẩu theo user) |
    | TOKEN_INVALID | 400 | Token trong link email sai, hết hạn hoặc đã dùng |
    | INVALID_CREDENTIALS | 400 | Sai email hoặc mật khẩu (cùng một lỗi cho cả hai) |
    | EMAIL_NOT_VERIFIED | 403 | Mật khẩu đúng nhưng tài khoản chưa kích hoạt |
    | ACCOUNT_LOCKED | 403 | Tài khoản bị khoá (khi đăng nhập, hoặc ở request kế tiếp nếu bị khoá giữa chừng) |
    | FORBIDDEN | 403 | Đã đăng nhập nhưng không đủ quyền |
    | INVALID_CURRENT_PASSWORD | 400 | Sai mật khẩu hiện tại khi đổi mật khẩu (400, không phải 401) |
    | PASSWORD_NOT_SET | 400 | Tài khoản chỉ dùng Google, chưa có mật khẩu để đổi |
    | CANNOT_REVOKE_CURRENT_SESSION | 400 | Thu hồi phiên hiện tại qua API phiên (hãy dùng đăng xuất) |
    | REGISTRATION_DISABLED | 403 | Super Admin đang tắt đăng ký tài khoản mới |
    | FEATURE_DISABLED | 403 | Tính năng đang tắt (vd. magic link) |
    | FEATURE_NOT_CONFIGURED | 404 | Dịch vụ tuỳ chọn chưa cấu hình biến môi trường (Google OAuth, R2) |
    | OAUTH_* | — | Lỗi Google OAuth, trả về frontend qua `/auth/callback?error=CODE` (CANCELLED, STATE_INVALID, EMAIL_NOT_VERIFIED, FAILED) |
    | CANNOT_MODIFY_SELF | 403 | Quản trị viên tự thao tác trên chính mình |
    | CANNOT_MODIFY_SUPER_ADMIN | 403 | Thao tác trên / gán vai trò Super Admin |
    | INSUFFICIENT_PERMISSION | 403 | Không đủ quyền với đối tượng này (vd. ADMIN khoá ADMIN) |
    | USER_STATE_CHANGED | 409 | Dữ liệu user vừa bị người khác đổi — tải lại rồi thử lại |
    | UPLOAD_NOT_FOUND | 400 | Báo upload xong nhưng chưa có object trên R2 |
    | UPLOAD_MISMATCH | 400 | Object trên R2 khác dung lượng / loại đã khai báo (đã bị xoá) |
    | MEDIA_IN_USE | 409 | Xoá ảnh đang được dùng — `details` là danh sách nơi dùng `{ label, href }` |
    | FOLDER_EXISTS | 409 | Tạo thư mục trùng tên (kể cả tên thư mục hệ thống) |
    | FOLDER_NOT_EMPTY | 409 | Xoá thư mục còn ảnh |
    | STORAGE_QUOTA_EXCEEDED | 403 | Vượt quota số file / dung lượng của user |
    | INVALID_AVATAR | 400 | Ảnh không dùng làm avatar được (không phải ảnh của mình trong folder avatars) |
    | SYSTEM_JOB_PROTECTED | 403 | Xoá job hệ thống (chỉ được tạm dừng) |
    | JOB_RUNNING | 409 | "Chạy ngay" / xoá khi job đang chạy |
    | CSRF_REJECTED | 403 | Thiếu header `X-Requested-With: XMLHttpRequest` ở route dùng cookie |
    | AUTH_TOKEN_INVALID | 401 | Access/refresh token sai (401 chỉ dùng cho lỗi token) |
    | AUTH_TOKEN_EXPIRED | 401 | Access token hết hạn → frontend gọi refresh |

    **Xác thực**: header `Authorization: Bearer <accessToken>` (JWT 15 phút). Refresh token
    nằm trong cookie httpOnly `refresh_token` (path `/api/v1/auth`).
servers:
  - url: /api/v1
    description: Cùng origin với Swagger UI (development)
tags:
  - name: System
    description: Vận hành hệ thống
  - name: Auth
    description: Đăng ký, xác thực email, đăng nhập, phiên
  - name: Users
    description: Tài khoản của người đang đăng nhập
  - name: Sessions
    description: Thiết bị đang đăng nhập của chính người dùng
  - name: Settings
    description: Cấu hình hệ thống (công khai + quản trị bởi Super Admin)
  - name: Admin Users
    description: Quản lý người dùng (ADMIN / SUPER_ADMIN)
  - name: Files
    description: File cá nhân trên Cloudflare R2 (chưa cấu hình R2 → 404)
  - name: Media
    description: Ảnh hệ thống (avatar, thư viện ảnh quản trị) trên R2
  - name: Jobs
    description: Lịch tự động (quản trị chỉ SUPER_ADMIN)
  - name: Stats
    description: Số liệu tổng quan khu quản trị
paths:
  /health:
    get:
      tags: [System]
      summary: Kiểm tra API và kết nối database
      operationId: getHealth
      responses:
        '200':
          description: API và database hoạt động
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản (chưa kích hoạt) và gửi email xác thực
      description: |
        Response luôn giống nhau dù email đã tồn tại hay chưa (không dò được email đã đăng ký):
        - Email mới → tạo tài khoản MEMBER chưa kích hoạt, gửi email xác thực (hạn 24 giờ).
        - Email đã kích hoạt → gửi email "bạn đã có tài khoản", không thay đổi gì.
        - Email chưa kích hoạt → huỷ link kích hoạt cũ, gửi link đặt mật khẩu (hạn 60 phút) để
          chống pre-account takeover.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                password:
                  type: string
                  minLength: 8
                  description: Tối đa 72 byte UTF-8
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Kích hoạt tài khoản bằng token trong email
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBody'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          description: '`TOKEN_INVALID` (sai / hết hạn / đã dùng) hoặc `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Gửi lại email xác thực
      description: Luôn trả 200; chỉ thực sự gửi khi email thuộc tài khoản chưa kích hoạt.
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập bằng email + mật khẩu
      description: |
        Thành công: trả access token + user, đặt cookie httpOnly `refresh_token`
        (`<sessionId>.<secret>`, 30 ngày). Sai email hay sai mật khẩu trả cùng một lỗi; trạng thái
        khoá / chưa kích hoạt chỉ được báo khi mật khẩu đúng. Rate limit 10 lần / 15 phút / IP.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Đăng nhập thành công
          headers:
            Set-Cookie:
              description: 'refresh_token=...; HttpOnly; Path=/api/v1/auth; SameSite=Lax'
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSession'
        '400':
          description: '`INVALID_CREDENTIALS` hoặc `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`EMAIL_NOT_VERIFIED` hoặc `ACCOUNT_LOCKED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Đổi refresh token (cookie) lấy access token mới, xoay vòng refresh token
      description: |
        Bắt buộc header `X-Requested-With: XMLHttpRequest` (chống CSRF) và cookie `refresh_token`.
        - Token hiện tại hợp lệ → access token mới + cookie refresh mới, phiên gia hạn 30 ngày.
        - Token ngay trước đó, trong 30 giây sau lần xoay (nhiều tab) → access token mới, KHÔNG
          đặt lại cookie.
        - Token ngay trước đó quá 30 giây → coi là bị đánh cắp, thu hồi cả phiên → 401.
        Thất bại luôn kèm xoá cookie.
      operationId: refreshSession
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: Phiên mới
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`CSRF_REJECTED` hoặc `ACCOUNT_LOCKED` (phiên bị thu hồi)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất phiên hiện tại (idempotent)
      description: Thu hồi phiên ứng với cookie `refresh_token` (phải đúng secret) và xoá cookie.
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '403':
          description: '`CSRF_REJECTED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Gửi link đặt lại mật khẩu (60 phút)
      description: Luôn trả 200 (không lộ email). Tài khoản bị khoá không nhận link.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Đặt mật khẩu mới bằng token trong email
      description: |
        Trong một transaction: tiêu thụ token, đặt mật khẩu, kích hoạt tài khoản nếu chưa, thu hồi
        MỌI phiên đăng nhập. Gửi email báo mật khẩu đã đổi.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          description: '`TOKEN_INVALID` hoặc `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users/me/password:
    patch:
      tags: [Users]
      summary: Đổi mật khẩu khi đang đăng nhập
      description: |
        Thu hồi mọi phiên KHÁC, giữ phiên hiện tại; gửi email báo mật khẩu đã đổi.
        Giới hạn 5 lần / 15 phút / **user** (không theo IP) — chống dò mật khẩu hiện tại
        bằng access token bị lộ.
      operationId: changeMyPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          description: '`INVALID_CURRENT_PASSWORD` (kèm details ô currentPassword), `PASSWORD_NOT_SET` hoặc `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/magic-link:
    post:
      tags: [Auth]
      summary: Gửi liên kết đăng nhập không cần mật khẩu (15 phút)
      description: Chỉ gửi cho tài khoản đã tồn tại; response luôn giống nhau.
      operationId: requestMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '403':
          description: '`FEATURE_DISABLED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/magic-link/verify:
    post:
      tags: [Auth]
      summary: Đăng nhập bằng token trong magic link
      description: |
        Tài khoản chưa kích hoạt được kích hoạt luôn. Tắt setting → link đã gửi cũng vô hiệu.
        Thành công giống POST /auth/login (access token + cookie refresh).
      operationId: loginWithMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBody'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSession'
        '400':
          description: '`TOKEN_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`FEATURE_DISABLED` hoặc `ACCOUNT_LOCKED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google:
    get:
      tags: [Auth]
      summary: Bắt đầu đăng nhập Google (điều hướng trình duyệt, không gọi bằng fetch)
      description: |
        Authorization Code + PKCE. Đặt cookie tạm httpOnly `oauth_google` (state + code verifier,
        10 phút, SameSite=Lax) rồi 302 sang Google. Chưa cấu hình `GOOGLE_*` → 404.
      operationId: startGoogleLogin
      responses:
        '302':
          description: Chuyển sang trang đăng nhập Google
        '404':
          description: '`FEATURE_NOT_CONFIGURED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google chuyển về sau khi người dùng đồng ý
      description: |
        Kiểm tra `state` với cookie tạm, đổi `code` (kèm code verifier) lấy ID token, rồi đăng nhập
        theo thứ tự: googleId → email (chỉ tin email Google đã xác minh; tài khoản local chưa kích
        hoạt bị xoá mật khẩu cũ) → tạo mới. Luôn 302 về `APP_URL/auth/callback`; thành công kèm
        cookie refresh (frontend gọi /auth/refresh lấy access token), thất bại kèm `?error=CODE`.
      operationId: googleCallback
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Về trang /auth/callback của frontend
  /settings/public:
    get:
      tags: [Settings]
      summary: Cấu hình công khai (không cần đăng nhập)
      operationId: getPublicSettings
      responses:
        '200':
          description: Setting `isPublic` + cờ tính năng theo biến môi trường
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          settings:
                            type: object
                            additionalProperties: true
                            example:
                              auth.registrationEnabled: true
                              auth.magicLinkEnabled: true
                          features:
                            type: object
                            properties:
                              googleOAuth:
                                type: boolean
                              storage:
                                type: boolean
  /admin/settings:
    get:
      tags: [Settings]
      summary: Toàn bộ setting kèm mô tả (Super Admin)
      operationId: listSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách setting
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SettingItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Settings]
      summary: Cập nhật nhiều setting trong một transaction (Super Admin)
      operationId: updateSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  description: 'key → giá trị; key lạ hoặc sai kiểu → 400'
                  example:
                    auth.magicLinkEnabled: false
                    email.provider: smtp
      responses:
        '200':
          description: Danh sách setting sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/settings/email-test:
    post:
      tags: [Settings]
      summary: Gửi email thử tới Super Admin đang đăng nhập qua một kênh (Super Admin)
      description: >-
        Chờ nhà cung cấp trả lời để báo lỗi ngay. Dùng kênh trong body (có thể khác kênh đang lưu)
        để thử trước khi đổi. Giới hạn 5 lần / 15 phút / user.
      operationId: sendTestEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [console, resend, smtp]
                  description: Kênh chưa cấu hình biến môi trường → 400
      responses:
        '200':
          description: Đã gửi — `message` = "Đã gửi email thử tới <email>"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          to:
                            type: string
                          provider:
                            type: string
        '400':
